# Enable mouse scrolling and selection
set -g mouse on
set-option -s set-clipboard off
set-option -g xterm-keys on
set-option -g destroy-unattached on

# reenable Ctrl + arrow keys
bind-key -n C-Left send-keys C-Left
bind-key -n C-Right send-keys C-Right



# Use Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Enable true color support
set -g default-terminal "tmux-256color"

# Set better scrolling (for large outputs)
set -g history-limit 10000

# Use vi-style keybindings in copy mode
setw -g mode-keys vi

# Easy copy-paste (press `v` to begin selection, `y` to copy)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Status bar configuration with CPU and RAM
set -g status on
set -g status-interval 2
set -g status-left "#[fg=green]#[bold] #S #[default]"

# Enable session persistence (keeps tmux running even after logout)
set -g detach-on-destroy off

# Automatically rename windows
set -g automatic-rename on
set -g automatic-rename-format "#W"

# Reload tmux config with Prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes with easy shortcuts
bind | split-window -h  # Vertical split
bind - split-window -v  # Horizontal split

# Fast pane cycling
bind -n C-h previous-window
bind -n C-l next-window

